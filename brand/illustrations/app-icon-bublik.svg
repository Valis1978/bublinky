<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- App icon: Sakio the shiba inside a soap bubble. Geometry adapted from
       the avatar rig (species/dog.tsx). iOS masks its own corners — keep it
       full-bleed, no transparency. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3F7"/>
      <stop offset="1" stop-color="#FBD3E7"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9A8D4"/>
      <stop offset="0.55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <clipPath id="bubbleClip"><circle cx="512" cy="536" r="352"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- soft background bokeh bubbles -->
  <circle cx="150" cy="180" r="70" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="880" cy="260" r="46" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="820" cy="850" r="60" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="140" cy="800" r="38" fill="#FFFFFF" opacity="0.3"/>

  <!-- main bubble body -->
  <circle cx="512" cy="536" r="352" fill="#FFFFFF" opacity="0.18"/>

  <!-- the shiba, clipped inside the bubble -->
  <g clip-path="url(#bubbleClip)">
    <g transform="translate(512 570) scale(4.35) translate(-100 -118)">
      <!-- upright ears -->
      <path d="M 80 74 Q 76 46 65 42 Q 58 54 56 78 Z" fill="#F0A264" stroke="#B06F3C" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M 120 74 Q 124 46 135 42 Q 142 54 144 78 Z" fill="#F0A264" stroke="#B06F3C" stroke-width="3.4" stroke-linejoin="round"/>
      <!-- body -->
      <path d="M 100 62 C 140 62 156 88 156 116 C 156 146 138 168 100 168 C 62 168 44 146 44 116 C 44 88 60 62 100 62 Z" fill="#F0A264" stroke="#B06F3C" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="100" cy="141" rx="31" ry="22" fill="#FDF3E3"/>
      <ellipse cx="79" cy="164.5" rx="12.5" ry="8" fill="#F0A264" stroke="#B06F3C" stroke-width="3"/>
      <ellipse cx="121" cy="164.5" rx="12.5" ry="8" fill="#F0A264" stroke="#B06F3C" stroke-width="3"/>
      <!-- cream inner ears + cheeks -->
      <g fill="#FDF3E3" opacity="0.75">
        <path d="M 74 66 Q 71 52 65 48 Q 61 58 60 68 Z"/>
        <path d="M 126 66 Q 129 52 135 48 Q 139 58 140 68 Z"/>
      </g>
      <g fill="#FDF3E3" opacity="0.85">
        <path d="M 46 106 Q 38 118 46 130 Q 56 134 62 128 Q 58 114 54 106 Q 50 103 46 106 Z"/>
        <path d="M 154 106 Q 162 118 154 130 Q 144 134 138 128 Q 142 114 146 106 Q 150 103 154 106 Z"/>
      </g>
      <!-- bubble-shine on the fur -->
      <path d="M 62 84 Q 72 70 88 66" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.5"/>
      <!-- muzzle + eyebrow dots -->
      <ellipse cx="100" cy="122" rx="16" ry="11" fill="#FDF3E3" stroke="#B06F3C" stroke-opacity="0.45" stroke-width="2.4"/>
      <ellipse cx="100" cy="114" rx="6" ry="4.8" fill="#4A3628"/>
      <ellipse cx="102" cy="112.6" rx="1.8" ry="1.2" fill="#FFFFFF" opacity="0.55"/>
      <g fill="#FDF3E3" stroke="#B06F3C" stroke-opacity="0.25" stroke-width="1.2">
        <ellipse cx="78" cy="91.5" rx="4.6" ry="3.4"/>
        <ellipse cx="122" cy="91.5" rx="4.6" ry="3.4"/>
      </g>
      <!-- happy face -->
      <g stroke="#3F3244" stroke-width="3.6" stroke-linecap="round" fill="none">
        <path d="M 71 106 Q 78 97 85 106"/>
        <path d="M 115 106 Q 122 97 129 106"/>
      </g>
      <path d="M 91 124 Q 100 132 109 124" stroke="#3F3244" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <g fill="#FB7185" opacity="0.35">
        <ellipse cx="62" cy="117" rx="7.5" ry="4.4"/>
        <ellipse cx="138" cy="117" rx="7.5" ry="4.4"/>
      </g>
    </g>
  </g>

  <!-- bubble rim + shine -->
  <circle cx="512" cy="536" r="352" fill="none" stroke="url(#rim)" stroke-width="14" opacity="0.9"/>
  <path d="M 268 340 Q 330 240 448 210" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none" opacity="0.75"/>
  <path d="M 700 806 Q 762 770 792 706" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- floating accents -->
  <circle cx="216" cy="196" r="34" fill="none" stroke="#C4B5FD" stroke-width="8" opacity="0.8"/>
  <circle cx="836" cy="330" r="24" fill="none" stroke="#F9A8D4" stroke-width="7" opacity="0.85"/>
  <circle cx="806" cy="180" r="16" fill="none" stroke="#86EFAC" stroke-width="6" opacity="0.8"/>
  <path d="M 176 560 Q 182 546 188 560 Q 202 566 188 572 Q 182 586 176 572 Q 162 566 176 560 Z" fill="#FBBF24" opacity="0.9"/>
  <path d="M 852 620 Q 856 610 860 620 Q 870 624 860 628 Q 856 638 852 628 Q 842 624 852 620 Z" fill="#FBBF24" opacity="0.8"/>
</svg>
